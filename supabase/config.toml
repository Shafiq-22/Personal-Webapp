# Supabase local development configuration.
project_id = "cortex"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "cortex://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Google is used both for sign-in and for Calendar access. The Calendar scopes
# are requested separately when the user connects a calendar, so signing in
# never implies calendar access.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[functions.monitor-fetch]
verify_jwt = false

[functions.digest-build]
verify_jwt = false

[functions.google-calendar-sync]
verify_jwt = false
